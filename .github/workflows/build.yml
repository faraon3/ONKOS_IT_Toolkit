name: Build ONKOS IT Toolkit

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publicar aplicación portable
        run: dotnet publish src/ONKOS.IT.Toolkit/ONKOS.IT.Toolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ONKOS-IT-Toolkit-win-x64
          path: publish/win-x64/
          if-no-files-found: error
