name: Build ONKOS IT Toolkit

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Evita acumular varias compilaciones simultáneas del mismo proyecto.
concurrency:
  group: onkos-it-toolkit-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publicar aplicación portable
        run: dotnet publish src/ONKOS.IT.Toolkit/ONKOS.IT.Toolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Comprimir versión portable
        shell: pwsh
        run: Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ONKOS-IT-Toolkit-win-x64.zip" -CompressionLevel Optimal

      # Permite descargar el ZIP directamente desde la ejecución de Actions.
      - name: Guardar ZIP como artefacto de Actions
        uses: actions/upload-artifact@v4
        with:
          name: ONKOS-IT-Toolkit-win-x64
          path: ONKOS-IT-Toolkit-win-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Usa GitHub CLI en lugar de softprops/action-gh-release para evitar
      # la advertencia de compatibilidad Node.js 20 de esa acción.
      - name: Publicar en GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest ONKOS-IT-Toolkit-win-x64.zip --title "ONKOS IT Toolkit - Última versión" --notes "Última versión portable de ONKOS IT Toolkit para Windows x64. Descarga el ZIP, extráelo y ejecuta ONKOS.IT.Toolkit.exe." --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "No fue posible crear o consultar el GitHub Release."
          }
          gh release upload latest ONKOS-IT-Toolkit-win-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "No fue posible cargar el ZIP en GitHub Releases."
          }
