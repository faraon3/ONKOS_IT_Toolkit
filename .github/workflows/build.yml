name: Build ONKOS IT Toolkit

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

# Evita acumular varias compilaciones simultáneas del mismo proyecto.
concurrency:
  group: onkos-it-toolkit-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publicar aplicación portable
        run: dotnet publish src/ONKOS.IT.Toolkit/ONKOS.IT.Toolkit.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Comprimir versión portable
        shell: pwsh
        run: Compress-Archive -Path "publish/win-x64/*" -DestinationPath "ONKOS-IT-Toolkit-win-x64.zip" -CompressionLevel Optimal

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ONKOS IT Toolkit - Última versión
          body: |
            Última versión portable de ONKOS IT Toolkit para Windows x64.
            Descarga el ZIP, extráelo y ejecuta ONKOS.IT.Toolkit.exe.
          files: ONKOS-IT-Toolkit-win-x64.zip
          overwrite_files: true
          make_latest: true
